name: NPM Package Publish

on:
  push:
    branches:
      - main
      - next
      - alpha

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check if version has been updated
        id: check
        uses: EndBug/version-check@095362f3cd50f690c8fa0e6afeea81834bd8d320 # v3.0.0

      - name: Setup Node
        # if: steps.check.outputs.changed == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Setup Java (required by Firebase emulators)
        # if: steps.check.outputs.changed == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: 26

      - name: Cache Firebase Emulators
        # if: steps.check.outputs.changed == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-firebase-emulators-

      - name: Install Dependencies
        # if: steps.check.outputs.changed == 'true'
        run: npm ci

      - name: Lint + Format Check
        # if: steps.check.outputs.changed == 'true'
        run: npm run check

      - name: Run Unit Tests + Coverage
        # if: steps.check.outputs.changed == 'true'
        run: npm run test:cov

      - name: Publish
        # if: steps.check.outputs.changed == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          gitBranch=${GITHUB_REF##*/}
          publishFlag=$(if [ "$GITHUB_REF" != 'refs/heads/main' ]; then eval echo '--tag $gitBranch'; else echo ''; fi;)
          echo "PACKAGE_VERSION=$(cat package.json | jq -r '.version')" >> $GITHUB_ENV
          npm publish $publishFlag

      - name: Upload Coverage
        # if: steps.check.outputs.changed == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODE_COV }}

      - name: Create Release
        # if: github.ref == 'refs/heads/main' && steps.check.outputs.changed == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ env.PACKAGE_VERSION }}
          name: v${{ env.PACKAGE_VERSION }}
          draft: false
          prerelease: false
