name: Verify

on: [pull_request]

jobs:
  build:
    name: Labeled
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 25.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@ # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Setup Java (required by Firebase emulators)
        uses: actions/setup-java@ # v6.1.0
        with:
          distribution: zulu
          java-version: 27

      - name: Cache Firebase Emulators
        uses: actions/cache@ # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-firebase-emulators-

      - name: Install Dependencies
        run: npm ci

      - name: Lint + Format Check
        run: npm run check

      - name: Run Unit Tests + Coverage
        run: npm run test:cov

      - name: Run Build
        run: npm run build

      - name: Upload Coverage
        if: matrix.node-version == '24.x'
        uses: codecov/codecov-action@ # v7.1.1
        with:
          token: ${{ secrets.CODE_COV }}
